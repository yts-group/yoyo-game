plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.earth_to_moon_learning_game"
    compileSdk = flutter.compileSdkVersion

    defaultConfig {
        applicationId = "com.example.earth_to_moon_learning_game"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = 1
        versionName = "1.0.0"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            // Uses the auto-generated debug keystore so the release build
            // is actually signed and can be installed directly on a phone.
            storeFile = signingConfigs.debug.storeFile
            storePassword = signingConfigs.debug.storePassword
            keyAlias = signingConfigs.debug.keyAlias
            keyPassword = signingConfigs.debug.keyPassword
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
